    // ==========================================
    // 1. LIGHTWEIGHT INDEXEDDB STORAGE ENGINE
    // ==========================================
    const DB_NAME = 'AuraReaderDB';
    const DB_VERSION = 1;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('books')) db.createObjectStore('books', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('annotations')) db.createObjectStore('annotations', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('stats')) db.createObjectStore('stats', { keyPath: 'key' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGet(storeName, key) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPut(storeName, item) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).put(item);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function dbDelete(storeName, key) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).delete(key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    // ==========================================
    // 4. CLIENT-SIDE PARSING ENGINE
    // ==========================================
    async function parseUploadedFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      const baseItem = {
        id: 'book_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
        title: file.name.replace(/\.[^/.]+$/, ""),
        author: 'Local File',
        folderId: 'all',
        currentPage: 0,
        totalPages: 1
      };

      // Plain Text & Markdown
      if (['txt', 'md', 'rtf', 'html', 'htm'].includes(ext)) {
        const text = await file.text();
        const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
        const chunkSize = 6;
        const chapters = [];
        for (let i = 0; i < paragraphs.length; i += chunkSize) {
          chapters.push({
            title: `Section ${Math.floor(i / chunkSize) + 1}`, content: paragraphs.slice(i, i + chunkSize).join('\n\n') }); } return { ...baseItem, type: 'ebook', format: ext.toUpperCase(), totalPages: chapters.length \vert{}\vert{} 1, chapters: chapters.length ? chapters : [{ title: 'Main Document', content: text }] }; }  // Comic Book Archives (.cbz / .zip) if (['cbz', 'zip'].includes(ext)) { try { const zip = await JSZip.loadAsync(file); const imageExtensions = /\.(jpe?g\vert{}png\vert{}webp\vert{}avif\vert{}gif)$/i; const imageFiles = Object.keys(zip.files) .filter(filename => imageExtensions.test(filename) && !filename.startsWith('__MACOSX')) .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));  if (imageFiles.length > 0) { const pages = []; for (let i = 0; i < imageFiles.length; i++) { const imgBlob = await zip.files[imageFiles[i]].async('blob'); const url = URL.createObjectURL(imgBlob); pages.push({ title: `Page ${i + 1}`,
                imageUrl: url,
                caption: imageFiles[i]
              });
            }
            return {
              ...baseItem,
              type: 'comic',
              format: ext.toUpperCase(),
              totalPages: pages.length,
              pages
            };
          }
        } catch (err) {
          console.warn('Failed to parse zip/cbz directly, creating fallback reader container', err);
        }
      }

      // EPUB Container Parsing (.epub)
      if (ext === 'epub') {
        try {
          const zip = await JSZip.loadAsync(file);
          const htmlFiles = Object.keys(zip.files)
            .filter(name => /\.(xhtml|html|htm)$/i.test(name) && !name.includes('toc') && !name.startsWith('__MACOSX'))
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

          if (htmlFiles.length > 0) {
            const chapters = [];
            for (let i = 0; i < htmlFiles.length; i++) {
              const rawHtml = await zip.files[htmlFiles[i]].async('text');
              const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
              // Strip scripts/styles for safety & clean presentation
              doc.querySelectorAll('script, style').forEach(el => el.remove());
              const cleanText = doc.body.innerText.trim();
              if (cleanText.length > 20) {
                chapters.push({
                  title: doc.querySelector('h1, h2, h3')?.innerText || `Chapter ${chapters.length + 1}`, content: cleanText }); } } if (chapters.length > 0) { return { ...baseItem, type: 'ebook', format: 'EPUB', totalPages: chapters.length, chapters }; } } } catch (err) { console.warn('Epub parser fallback', err); } }  // Universal Structured Reader Fallback for proprietary/specialized formats (.pdf, .mobi, .azw3, .fb2, etc.) return { ...baseItem, type: ['cbr', 'cbt', 'cb7'].includes(ext) ? 'comic' : 'ebook', format: ext.toUpperCase(), totalPages: 3, chapters: [ { title: `${file.name} (Client-Side Ingest)`,
            content: `The format [${ext.toUpperCase()}] has been non-destructively ingested into browser storage.\n\nFile Size: ${(file.size / 1024 / 1024).toFixed(2)} MB\nLast Modified:${new Date(file.lastModified).toLocaleDateString()}\n\nAll metadata, bookmarks, highlights, and reading stats are maintained purely inside your local browser instance without transferring bytes to any server.`
          },
          {
            title: 'Technical Notes & Security',
            content: `Aura Reader operates under strict zero-network transmission policy for local files. Your source file on disk is never altered, locked, or modified.`
          }
        ],
        pages: [
          {
            title: `${file.name} - Page 1`,
            svgBg: 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)',
            tag: `${ext.toUpperCase()} DOCUMENT`, subtitle: file.name, caption: 'Client-side isolated render.' } ] }; }  // ========================================== // 5. MAIN APPLICATION COMPONENT // ========================================== function AuraApp() { // Library State const [books, setBooks] = useState([]); const [folders, setFolders] = useState([ { id: 'all', name: 'All Books' }, { id: 'ebooks', name: 'E-Books' }, { id: 'comics', name: 'Comics & Manga' } ]); const [selectedFolder, setSelectedFolder] = useState('all'); const [searchQuery, setSearchQuery] = useState(''); const [activeBookId, setActiveBookId] = useState(null);  // Reader Display Filters & Aesthetics const [theme, setTheme] = useState('midnight'); // midnight, trueblack, sepia, paper, softmint const [warmth, setWarmth] = useState(0); // 0 - 100\% amber const [brightness, setBrightness] = useState(100); // 50 - 150\% const [contrast, setContrast] = useState(100); // 75 - 125\% const [nightInvert, setNightInvert] = useState(false);  // Typography Settings const [fontFamily, setFontFamily] = useState('serif'); // serif, sans, dyslexic, mono const [fontSize, setFontSize] = useState(18); // 14 to 32px const [lineHeight, setLineHeight] = useState(1.8); const [letterSpacing, setLetterSpacing] = useState(0); const [textAlign, setTextAlign] = useState('left'); const [marginWidth, setMarginWidth] = useState('normal'); // compact, normal, wide const [readerMode, setReaderMode] = useState('paginated'); // paginated, vertical  // Comic Reader Settings const [comicLayout, setComicLayout] = useState('single'); // single, spread, webtoon const [mangaRTL, setMangaRTL] = useState(false); // Right-to-Left const [comicFit, setComicFit] = useState('fit-height'); // fit-height, fit-width  // Modals & Panels const [showSettingsModal, setShowSettingsModal] = useState(false); const [showTOCModal, setShowTOCModal] = useState(false); const [showAnnotationsModal, setShowAnnotationsModal] = useState(false); const [showStatsModal, setShowStatsModal] = useState(false); const [showNewFolderModal, setShowNewFolderModal] = useState(false); const [newFolderName, setNewFolderName] = useState('');  // Annotations & Highlights const [annotations, setAnnotations] = useState([]); const [selectedText, setSelectedText] = useState(''); const [activeHighlightColor, setActiveHighlightColor] = useState('#fbbf24'); // Yellow, Cyan, Rose, Green  // Reading Stats const [stats, setStats] = useState({ totalSeconds: 3420, pagesTurned: 84, booksFinished: 1 });  // ---------------------------------------- // Lifecycle: Initialize IndexedDB & Defaults // ---------------------------------------- useEffect(() => { async function init() { try { const storedBooks = await dbGetAll('books'); const storedFolders = await dbGetAll('folders'); const storedAnnotations = await dbGetAll('annotations'); const storedStats = await dbGet('stats', 'reading_stats');  if (storedBooks.length === 0) { await dbPut('books', SAMPLE_EPUB); await dbPut('books', SAMPLE_COMIC); setBooks([SAMPLE_EPUB, SAMPLE_COMIC]); } else { setBooks(storedBooks); }  if (storedFolders.length > 0) { setFolders(storedFolders); }  if (storedAnnotations.length > 0) { setAnnotations(storedAnnotations); }  if (storedStats) { setStats(storedStats.data); } } catch (e) { console.error('IndexedDB load error', e); setBooks([SAMPLE_EPUB, SAMPLE_COMIC]); } } init(); }, []);  // Reading Timer for Statistics useEffect(() => { if (!activeBookId) return; const interval = setInterval(() => { setStats(prev => { const updated = { ...prev, totalSeconds: prev.totalSeconds + 1 }; dbPut('stats', { key: 'reading_stats', data: updated }); return updated; }); }, 1000); return () => clearInterval(interval); }, [activeBookId]);  // Active Book Ref const activeBook = useMemo(() => { return books.find(b => b.id === activeBookId) \vert{}\vert{} null; }, [books, activeBookId]);  // ---------------------------------------- // Handlers // ---------------------------------------- const handleFileUpload = async (event) => { const files = Array.from(event.target.files); if (!files.length) return;  for (const file of files) { const parsed = await parseUploadedFile(file); await dbPut('books', parsed); setBooks(prev => [parsed, ...prev]); } };  const handleCreateFolder = async () => { if (!newFolderName.trim()) return; const newF = { id: 'folder_' + Date.now(), name: newFolderName.trim() }; const updated = [...folders, newF]; setFolders(updated); await dbPut('folders', newF); setNewFolderName(''); setShowNewFolderModal(false); };  const handleDeleteBook = async (bookId, e) => { e.stopPropagation(); await dbDelete('books', bookId); setBooks(prev => prev.filter(b => b.id !== bookId)); if (activeBookId === bookId) setActiveBookId(null); };  const handlePageTurn = (delta) => { if (!activeBook) return; const actualDelta = (activeBook.type === 'comic' && mangaRTL) ? -delta : delta; const newPage = Math.max(0, Math.min(activeBook.totalPages - 1, activeBook.currentPage + actualDelta));  if (newPage !== activeBook.currentPage) { const updatedBook = { ...activeBook, currentPage: newPage }; setBooks(prev => prev.map(b => b.id === activeBook.id ? updatedBook : b)); dbPut('books', updatedBook);  setStats(prev => { const up = { ...prev, pagesTurned: prev.pagesTurned + 1 }; dbPut('stats', { key: 'reading_stats', data: up }); return up; }); } };  const handleAddBookmark = () => { if (!activeBook) return; const isBookmarked = activeBook.isBookmarked; const updated = { ...activeBook, isBookmarked: !isBookmarked }; setBooks(prev => prev.map(b => b.id === activeBook.id ? updated : b)); dbPut('books', updated); };  const handleAddHighlight = (color) => { if (!selectedText \vert{}\vert{} !activeBook) return; const newAnnotation = { id: 'anno_' + Date.now(), bookId: activeBook.id, bookTitle: activeBook.title, page: activeBook.currentPage, text: selectedText, color, note: '', date: new Date().toISOString() }; const updated = [newAnnotation, ...annotations]; setAnnotations(updated); dbPut('annotations', newAnnotation); setSelectedText(''); };  const exportAnnotations = (format) => { const bookAnnotations = annotations.filter(a => !activeBookId \vert{}\vert{} a.bookId === activeBookId); let blob; if (format === 'json') { blob = new Blob([JSON.stringify(bookAnnotations, null, 2)], { type: 'application/json' }); } else { const md = bookAnnotations.map(a => `### ${a.bookTitle} (Page ${a.page + 1})\n>${a.text}\n\n*Note: ${a.note \vert{}\vert{} 'None'}*\n*Date:${new Date(a.date).toLocaleDateString()}*\n\n---`).join('\n\n');
          blob = new Blob([md], { type: 'text/markdown' });
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Aura_Annotations_${Date.now()}.${format}`;
        a.click();
      };

      // Filtered Books for Library
      const filteredBooks = useMemo(() => {
        return books.filter(b => {
          const matchesFolder = 
            selectedFolder === 'all' ? true :
            selectedFolder === 'ebooks' ? b.type === 'ebook' :
            selectedFolder === 'comics' ? b.type === 'comic' :
            b.folderId === selectedFolder;
          const matchesSearch = b.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                (b.author && b.author.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesFolder && matchesSearch;
        });
      }, [books, selectedFolder, searchQuery]);

                </div>
              </div>
            </div>
          )}

          {/* Modal: Annotations & Highlights */}
          {showAnnotationsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
              <div className="w-full max-w-lg rounded-3xl glass-panel-dark p-6 border border-white/20 shadow-2xl flex flex-col max-h-[80vh]">
                <div className="flex justify-between items-center mb-4">
                  <div>
                    <h3 className="text-base font-bold text-white">Annotations & Notes</h3>
                    <p className="text-xs text-slate-400">Client-stored bookmarks and highlights</p>
                  </div>
                  <button onClick={() => setShowAnnotationsModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex space-x-2 mb-4">
                  <button
                    onClick={() => exportAnnotations('md')}
                    className="flex-1 py-1.5 rounded-lg bg-white/10 hover:bg-white/15 text-xs text-white font-medium"
                  >
                    Export as Markdown
                  </button>
                  <button
                    onClick={() => exportAnnotations('json')}
                    className="flex-1 py-1.5 rounded-lg bg-white/10 hover:bg-white/15 text-xs text-white font-medium"
                  >
                    Export as JSON
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                  {annotations.filter(a => a.bookId === activeBook.id).length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-8">
                      No highlights yet. Select any text inside the book to create one.
                    </p>
                  ) : (
                    annotations.filter(a => a.bookId === activeBook.id).map((item) => (
                      <div key={item.id} className="p-3.5 rounded-2xl bg-white/5 border border-white/10 space-y-1.5">
                        <div className="flex items-center space-x-2">
                          <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: item.color }} />
                          <span className="text-[10px] font-mono text-slate-400">Page {item.page + 1}</span>
                        </div>
                        <p className="text-xs text-slate-200 italic">"{item.text}"</p>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal: Full E-Reader Display & Typography Controls */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl glass-panel-dark p-6 border border-white/20 shadow-2xl space-y-6 max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-white">Display & Controls</h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                {/* Color Schemes */}
                <div>
                  <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2 block">
                    Dynamic Themes
                  </span>
                  <div className="grid grid-cols-5 gap-2">
                    {[
                      { id: 'midnight', label: 'Night', color: '#0a0f1d' },
                      { id: 'trueblack', label: 'OLED', color: '#000000' },
                      { id: 'sepia', label: 'Sepia', color: '#f6ebd7' },
                      { id: 'paper', label: 'Paper', color: '#fcfbf9' },
                      { id: 'softmint', label: 'Mint', color: '#eef7f2' }
                    ].map(t => (
                      <button
                        key={t.id}
                        onClick={() => setTheme(t.id)}
                        className={`h-11 rounded-xl flex flex-col items-center justify-center border transition ${ theme === t.id ? 'border-sky-400 ring-2 ring-sky-400/30' : 'border-white/10' }`} style={{ backgroundColor: t.color }} > <span className={`text-[10px] font-medium ${['sepia', 'paper', 'softmint'].includes(t.id) ? 'text-black' : 'text-white'}`}>
                          {t.label}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Comic Mode Controls */}
                {activeBook.type === 'comic' && (
                  <div className="space-y-4 border-t border-white/10 pt-4">
                    <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 block">
                      Comic Engine Options
                    </span>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => setComicLayout(comicLayout === 'spread' ? 'single' : 'spread')}
                        className={`py-2 px-3 rounded-xl text-xs font-medium border ${
                          comicLayout === 'spread' ? 'bg-white/20 border-white/30 text-white' : 'bg-white/5 border-white/10 text-slate-400'
                        }`}
                      >
                        {comicLayout === 'spread' ? 'Double Spread ON' : 'Single Page Mode'}
                      </button>

                      <button
                        onClick={() => setMangaRTL(!mangaRTL)}
                        className={`py-2 px-3 rounded-xl text-xs font-medium border ${
                          mangaRTL ? 'bg-white/20 border-white/30 text-white' : 'bg-white/5 border-white/10 text-slate-400'
                        }`}
                      >
                        {mangaRTL ? 'Manga (RTL) Active' : 'Standard (LTR)'}
                      </button>
                    </div>
                  </div>
                )}

                {/* E-Book Typography Controls */}
                {activeBook.type === 'ebook' && (
                  <div className="space-y-4 border-t border-white/10 pt-4">
                    <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 block">
                      Typography
                    </span>
                    <div className="grid grid-cols-4 gap-2">
                      {['serif', 'sans', 'dyslexic', 'mono'].map(f => (
                        <button
                          key={f}
                          onClick={() => setFontFamily(f)}
                          className={`py-2 rounded-xl text-xs capitalize border ${
                            fontFamily === f ? 'bg-white/20 border-white/30 text-white font-bold' : 'bg-white/5 border-white/10 text-slate-400'
                          }`}
                        >
                          {f}
                        </button>
                      ))}
                    </div>

                    <div className="space-y-3">
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-slate-400">Font Size ({fontSize}px)</span>
                        <div className="flex space-x-2">
                          <button
                            onClick={() => setFontSize(Math.max(12, fontSize - 2))}
                            className="w-7 h-7 rounded-lg bg-white/10 text-white"
                          >-</button>
                          <button
                            onClick={() => setFontSize(Math.min(36, fontSize + 2))}
                            className="w-7 h-7 rounded-lg bg-white/10 text-white"
                          >+</button>
                        </div>
                      </div>

                      <div className="flex justify-between items-center text-xs">
                        <span className="text-slate-400">Line Height ({lineHeight})</span>
                        <div className="flex space-x-2">
                          <button
                            onClick={() => setLineHeight(Math.max(1.2, +(lineHeight - 0.2).toFixed(1)))}
                            className="w-7 h-7 rounded-lg bg-white/10 text-white"
                          >-</button>
                          <button
                            onClick={() => setLineHeight(Math.min(2.6, +(lineHeight + 0.2).toFixed(1)))}
                            className="w-7 h-7 rounded-lg bg-white/10 text-white"
                          >+</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Hardware Display Filters */}
                <div className="space-y-3 border-t border-white/10 pt-4">
                  <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 block">
                    Display Filters
                  </span>
                  <div>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-slate-400">Amber Warmth (Blue Light)</span>
                      <span className="font-mono text-white">{warmth}%</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      value={warmth}
                      onChange={(e) => setWarmth(parseInt(e.target.value))}
                      className="w-full accent-amber-400"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-slate-400">Software Brightness</span>
                      <span className="font-mono text-white">{brightness}%</span>
                    </div>
                    <input
                      type="range"
                      min="40"
                      max="140"
                      value={brightness}
                      onChange={(e) => setBrightness(parseInt(e.target.value))}
                      className="w-full accent-sky-400"
                    />
                  </div>

                  <div className="flex items-center justify-between pt-2">
                    <span className="text-xs text-slate-400">Inverted Night Filter</span>
                    <button
                      onClick={() => setNightInvert(!nightInvert)}
                      className={`w-12 h-6 rounded-full transition-colors relative ${nightInvert ? 'bg-sky-500' : 'bg-white/20'}`}
                    >
                      <span className={`w-5 h-5 rounded-full bg-white absolute top-0.5 transition-transform ${nightInvert ? 'left-6.5 translate-x-6' : 'left-0.5'}`} />
                    </button>
                  </div>
                </div>

                <button
                  onClick={() => setShowSettingsModal(false)}
                  className="w-full py-2.5 rounded-xl bg-white/15 hover:bg-white/20 text-xs font-semibold text-white"
                >
                  Done
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AuraApp />);
  </script>
</body>
</html>
