<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Aura Reader — Universal E-Book & Comic Engine</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM (via cdnjs for maximum reliability) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone (via cdnjs with env/react preset compatibility) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  
  <!-- JSZip -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/npm/opendyslexic@0.1.1/open-dyslexic-regular.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    .font-dyslexic { font-family: 'OpenDyslexic', sans-serif; }
    .font-serif-book { font-family: 'Merriweather', Georgia, serif; }
    .font-sans-ui { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }

    .glass-panel {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .glass-panel-dark {
      background: rgba(18, 18, 22, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 9999px; }
    
    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .selectable-text {
      user-select: text;
      -webkit-user-select: text;
    }
  </style>

  <!-- Global Error Catcher -->
  <script>
    window.addEventListener('error', function(e) {
      var root = document.getElementById('root');
      if (root && !root.hasChildNodes()) {
        root.innerHTML = '<div style="padding: 24px; color: #f87171; font-family: monospace; font-size: 13px; line-height: 1.5;">' +
          '<strong>Runtime Error:</strong><br>' + e.message + '<br><br>' +
          '<strong>File:</strong> ' + e.filename + ':' + e.lineno + '</div>';
      }
    });
  </script>
</head>
<body class="bg-black text-slate-100 font-sans-ui overflow-hidden antialiased">
  <div id="root"></div>

  <!-- Explicit React/Env Preset Definition for In-Browser Babel -->
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef, useMemo } = React;

    const DB_NAME = 'AuraReaderDB';
    const DB_VERSION = 1;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('books')) db.createObjectStore('books', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('annotations')) db.createObjectStore('annotations', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('stats')) db.createObjectStore('stats', { keyPath: 'key' });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (err) {
          reject(err);
        }
      });
    }

    async function dbGet(storeName, key) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPut(storeName, item) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).put(item);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function dbDelete(storeName, key) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).delete(key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        book: <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z M6.5 2a2.5 2.5 0 0 0-2.5 2.5v15a2.5 2.5 0 0 0 2.5 2.5 M4 6h16" />,
        comic: <path d="M21 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3 M3 12h18 M12 3v18 M16.5 7.5l-9 9" />,
        folder: <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />,
        sliders: <path d="M4 21v-7 M4 10V3 M12 21v-9 M12 8V3 M20 21v-5 M20 12V3 M1 14h6 M9 8h6 M17 16h6" />,
        bookmark: <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />,
        bookmarkActive: <path fill="currentColor" d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />,
        chevronLeft: <path d="m15 18-6-6 6-6" />,
        chevronRight: <path d="m9 18 6-6-6-6" />,
        plus: <path d="M5 12h14 M12 5v14" />,
        upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12" />,
        trash: <path d="M3 6h18 M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6 M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />,
        toc: <path d="M3 6h18 M3 12h18 M3 18h12" />,
        stats: <path d="M18 20V10 M12 20V4 M6 20v-6" />,
        x: <path d="M18 6 6 18 M6 6l12 12" />,
        highlight: <path d="m9 11-6 6v3h3l6-6 M22 2l-3 3-4-4 3-3a2.83 2.83 0 0 1 4 4z M14 6l4 4" />,
        search: <path d="m21 21-4.35-4.35 M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" />
      };
      return (
        <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
          {icons[name] || null}
        </svg>
      );
    };

    const SAMPLE_EPUB = {
      id: 'sample-book-1',
      title: 'Chronicles of the Glass Horizon',
      author: 'Aura Collective',
      type: 'ebook',
      format: 'EPUB',
      folderId: 'all',
      currentPage: 0,
      totalPages: 3,
      chapters: [
        {
          title: 'Prologue: The Silicate Dawn',
          content: 'In the middle of the twenty-fourth century, memory ceased to be recorded on electromagnetic drives. What remained was encapsulated into fused-quartz silicate slabs—crystalline sheets unaffected by radiation, temperature, or the degradation of time.\n\nFrom the high balconies of the Neo-Alexandria Library, the light filtered through millions of prismatically arrayed shards. Every shard held a century of history, poetry, and technical schematics.'
        },
        {
          title: 'Chapter I: The Refraction Node',
          content: 'Vea adjusted her retinal overlay. The ambient warmth of the desert wind clashed against the sub-zero cooling radiators of the vault.\n\n1. All preserved knowledge is non-destructive by design.\n2. No entity may revoke access to the core repositories.\n3. The observer is the final validator of truth.'
        },
        {
          title: 'Chapter II: The Universal Gateway',
          content: 'The beauty of the glass system was its universal interoperability. A single optical collector could process any encoded standard—from ancient ASCII scrolls to multi-layered holographic codices.'
        }
      ]
    };

    const SAMPLE_COMIC = {
      id: 'sample-comic-1',
      title: 'NEO-TOKYO: Solar Eclipse Vol. 1',
      author: 'CyberKinetics Studio',
      type: 'comic',
      format: 'CBZ',
      folderId: 'all',
      currentPage: 0,
      totalPages: 3,
      pages: [
        {
          title: 'Cover Page',
          svgBg: 'linear-gradient(135deg, #09090e 0%, #170b28 50%, #3b0764 100%)',
          tag: 'ISSUE #01 // CYBERPUNK',
          subtitle: 'SOLAR ECLIPSE OVER THE MEGAPOLIS',
          caption: 'Page 1 — The descent into Sector 07.'
        },
        {
          title: 'Sector 07 Alleyway',
          svgBg: 'linear-gradient(135deg, #020617 0%, #1e1b4b 50%, #0369a1 100%)',
          tag: 'PANEL 2 // CONTACT',
          subtitle: 'NEON RAIN & OPTICAL DRIFT',
          caption: 'Page 2 — Navigating the lower conduits.'
        },
        {
          title: 'The Neural Citadel',
          svgBg: 'linear-gradient(135deg, #18181b 0%, #450a0a 50%, #991b1b 100%)',
          tag: 'PANEL 3 // BREACH',
          subtitle: 'THE DATA ARCHIVE EXPOSED',
          caption: 'Page 3 — Vault locks disengage.'
        }
      ]
    };

    async function parseUploadedFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      const baseItem = {
        id: 'book_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
        title: file.name.replace(/\.[^/.]+$/, ""),
        author: 'Local Document',
        folderId: 'all',
        currentPage: 0,
        totalPages: 1
      };

      if (['txt', 'md', 'rtf', 'html', 'htm'].includes(ext)) {
        const text = await file.text();
        const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
        const chunkSize = 6;
        const chapters = [];
        for (let i = 0; i < paragraphs.length; i += chunkSize) {
          chapters.push({
            title: `Section ${Math.floor(i / chunkSize) + 1}`,
            content: paragraphs.slice(i, i + chunkSize).join('\n\n')
          });
        }
        return {
          ...baseItem,
          type: 'ebook',
          format: ext.toUpperCase(),
          totalPages: chapters.length || 1,
          chapters: chapters.length ? chapters : [{ title: 'Main Document', content: text }]
        };
      }

      if (['cbz', 'zip'].includes(ext)) {
        try {
          const zip = await JSZip.loadAsync(file);
          const imageExtensions = /\.(jpe?g|png|webp|avif|gif)$/i;
          const imageFiles = Object.keys(zip.files)
            .filter(name => imageExtensions.test(name) && !name.startsWith('__MACOSX'))
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

          if (imageFiles.length > 0) {
            const pages = [];
            for (let i = 0; i < imageFiles.length; i++) {
              const imgBlob = await zip.files[imageFiles[i]].async('blob');
              pages.push({
                title: `Page ${i + 1}`,
                imageUrl: URL.createObjectURL(imgBlob),
                caption: imageFiles[i]
              });
            }
            return {
              ...baseItem,
              type: 'comic',
              format: ext.toUpperCase(),
              totalPages: pages.length,
              pages
            };
          }
        } catch (err) {
          console.warn('Archive parse fallback', err);
        }
      }

      return {
        ...baseItem,
        type: ['cbr', 'cbt', 'cb7'].includes(ext) ? 'comic' : 'ebook',
        format: ext.toUpperCase(),
        totalPages: 1,
        chapters: [{ title: file.name, content: 'Format processed client-side. File successfully loaded into storage.' }]
      };
    }

    function AuraApp() {
      const [books, setBooks] = useState([]);
      const [folders, setFolders] = useState([
        { id: 'all', name: 'All Books' },
        { id: 'ebooks', name: 'E-Books' },
        { id: 'comics', name: 'Comics & Manga' }
      ]);
      const [selectedFolder, setSelectedFolder] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeBookId, setActiveBookId] = useState(null);

      const [theme, setTheme] = useState('midnight');
      const [warmth, setWarmth] = useState(0);
      const [brightness, setBrightness] = useState(100);
      const [fontSize, setFontSize] = useState(18);

      const [comicLayout, setComicLayout] = useState('single');
      const [mangaRTL, setMangaRTL] = useState(false);

      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showTOCModal, setShowTOCModal] = useState(false);

      useEffect(() => {
        async function init() {
          try {
            const storedBooks = await dbGetAll('books');
            if (!storedBooks || storedBooks.length === 0) {
              await dbPut('books', SAMPLE_EPUB);
              await dbPut('books', SAMPLE_COMIC);
              setBooks([SAMPLE_EPUB, SAMPLE_COMIC]);
            } else {
              setBooks(storedBooks);
            }
          } catch (e) {
            console.warn('Using in-memory store fallback:', e);
            setBooks([SAMPLE_EPUB, SAMPLE_COMIC]);
          }
        }
        init();
      }, []);

      const activeBook = useMemo(() => {
        return books.find(b => b.id === activeBookId) || null;
      }, [books, activeBookId]);

      const handleFileUpload = async (event) => {
        const files = Array.from(event.target.files);
        if (!files.length) return;
        for (const file of files) {
          const parsed = await parseUploadedFile(file);
          try { await dbPut('books', parsed); } catch(e) {}
          setBooks(prev => [parsed, ...prev]);
        }
      };

      const handlePageTurn = (delta) => {
        if (!activeBook) return;
        const actualDelta = (activeBook.type === 'comic' && mangaRTL) ? -delta : delta;
        const newPage = Math.max(0, Math.min(activeBook.totalPages - 1, activeBook.currentPage + actualDelta));
        if (newPage !== activeBook.currentPage) {
          const updatedBook = { ...activeBook, currentPage: newPage };
          setBooks(prev => prev.map(b => b.id === activeBook.id ? updatedBook : b));
          try { dbPut('books', updatedBook); } catch(e) {}
        }
      };

      const filteredBooks = useMemo(() => {
        return books.filter(b => {
          const matchesFolder = 
            selectedFolder === 'all' ? true :
            selectedFolder === 'ebooks' ? b.type === 'ebook' :
            selectedFolder === 'comics' ? b.type === 'comic' :
            b.folderId === selectedFolder;
          const matchesSearch = b.title.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesFolder && matchesSearch;
        });
      }, [books, selectedFolder, searchQuery]);

      const themeColors = {
        midnight: { bg: 'bg-[#0a0f1d]', text: 'text-slate-100' },
        trueblack: { bg: 'bg-black', text: 'text-neutral-100' },
        sepia: { bg: 'bg-[#f6ebd7]', text: 'text-[#443224]' },
        paper: { bg: 'bg-[#fcfbf9]', text: 'text-[#1c1917]' }
      };
      const currentTheme = themeColors[theme] || themeColors.midnight;

      if (!activeBookId) {
        return (
          <div className="flex h-screen w-screen overflow-hidden bg-gradient-to-br from-[#07090e] via-[#0d111d] to-[#141b2d] text-slate-100">
            <aside className="w-64 border-r border-white/10 glass-panel-dark flex flex-col justify-between hidden md:flex">
              <div className="p-6">
                <div className="flex items-center space-x-3 mb-8">
                  <div className="w-9 h-9 rounded-xl bg-sky-500 flex items-center justify-center">
                    <Icon name="book" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="font-bold text-base text-white">Aura Reader</h1>
                    <p className="text-[10px] text-sky-400 font-mono">100% Client-Side</p>
                  </div>
                </div>
                <div className="space-y-1">
                  {folders.map(f => (
                    <button
                      key={f.id}
                      onClick={() => setSelectedFolder(f.id)}
                      className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm ${
                        selectedFolder === f.id ? 'bg-white/15 text-white' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      <span>{f.name}</span>
                      <span className="text-xs opacity-60">
                        {books.filter(b => f.id === 'all' || (f.id === 'ebooks' ? b.type === 'ebook' : f.id === 'comics' ? b.type === 'comic' : true)).length}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </aside>

            <main className="flex-1 flex flex-col h-full overflow-hidden">
              <header className="h-16 border-b border-white/10 glass-panel-dark px-6 flex items-center justify-between">
                <div className="relative w-72">
                  <Icon name="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Search books..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-1.5 text-xs text-white focus:outline-none"
                  />
                </div>
                <label className="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-white font-medium text-xs cursor-pointer">
                  <Icon name="upload" className="w-4 h-4" />
                  <span>Import File</span>
                  <input type="file" multiple onChange={handleFileUpload} className="hidden" />
                </label>
              </header>

              <div className="flex-1 overflow-y-auto p-6">
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                  {filteredBooks.map(book => (
                    <div
                      key={book.id}
                      onClick={() => setActiveBookId(book.id)}
                      className="rounded-2xl p-3 glass-panel hover:bg-white/15 cursor-pointer transition flex flex-col justify-between"
                    >
                      <div className="aspect-[3/4] w-full rounded-xl overflow-hidden mb-3 bg-neutral-900 border border-white/10 p-4 flex flex-col justify-between">
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 self-start">
                          {book.format}
                        </span>
                        <div>
                          <h4 className="font-bold text-xs text-white line-clamp-2">{book.title}</h4>
                          <p className="text-[10px] text-slate-400 mt-0.5">{book.author}</p>
                        </div>
                      </div>
                      <div className="flex justify-between items-center text-[10px] text-slate-400 font-mono">
                        <span>p. {book.currentPage + 1}/{book.totalPages}</span>
                        <span>{Math.round(((book.currentPage + 1) / book.totalPages) * 100)}%</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          </div>
        );
      }

      return (
        <div
          className={`h-screen w-screen flex flex-col ${currentTheme.bg} ${currentTheme.text}`}
          style={{ filter: `brightness(${brightness}%)` }}
        >
          <div
            className="pointer-events-none fixed inset-0 z-40 transition-opacity"
            style={{ backgroundColor: '#ff9800', opacity: warmth / 250, mixBlendMode: 'multiply' }}
          />

          <header className="h-14 px-4 flex items-center justify-between border-b border-white/10 glass-panel-dark z-30">
            <button onClick={() => setActiveBookId(null)} className="p-2 hover:bg-white/10 rounded-lg">
              <Icon name="chevronLeft" className="w-5 h-5" />
            </button>
            <span className="text-xs font-bold truncate max-w-xs">{activeBook.title}</span>
            <div className="flex space-x-1">
              <button onClick={() => setShowTOCModal(true)} className="p-2 hover:bg-white/10 rounded-lg">
                <Icon name="toc" className="w-4 h-4" />
              </button>
              <button onClick={() => setShowSettingsModal(true)} className="p-2 hover:bg-white/10 rounded-lg">
                <Icon name="sliders" className="w-4 h-4" />
              </button>
            </div>
          </header>

          <main className="flex-1 relative overflow-hidden flex items-center justify-center p-6">
            <div onClick={() => handlePageTurn(-1)} className="absolute left-0 top-0 bottom-0 w-16 z-20 cursor-w-resize" />
            <div onClick={() => handlePageTurn(1)} className="absolute right-0 top-0 bottom-0 w-16 z-20 cursor-e-resize" />

            {activeBook.type === 'comic' ? (
              <div className="max-h-full max-w-full flex items-center justify-center">
                {activeBook.pages?.[activeBook.currentPage]?.imageUrl ? (
                  <img
                    src={activeBook.pages[activeBook.currentPage].imageUrl}
                    alt="Comic Page"
                    className="max-h-[80vh] object-contain rounded-xl shadow-2xl"
                  />
                ) : (
                  <div
                    className="aspect-[3/4.2] h-[78vh] rounded-2xl p-6 flex flex-col justify-between border border-white/10"
                    style={{ background: activeBook.pages?.[activeBook.currentPage]?.svgBg || '#1e1b4b' }}
                  >
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/20 self-start text-white">
                      {activeBook.pages?.[activeBook.currentPage]?.tag || 'PAGE'}
                    </span>
                    <div>
                      <h3 className="text-lg font-bold text-white mb-1">
                        {activeBook.pages?.[activeBook.currentPage]?.subtitle || activeBook.title}
                      </h3>
                      <p className="text-xs text-slate-300">
                        {activeBook.pages?.[activeBook.currentPage]?.caption}
                      </p>
                    </div>
                    <span className="text-[10px] font-mono text-slate-400">
                      Page {activeBook.currentPage + 1} of {activeBook.totalPages}
                    </span>
                  </div>
                )}
              </div>
            ) : (
              <div className="max-w-2xl w-full h-full overflow-y-auto font-serif-book selectable-text py-6 px-4">
                <h2 className="text-xl font-bold mb-6 border-b border-white/10 pb-2">
                  {activeBook.chapters?.[activeBook.currentPage]?.title || 'Section'}
                </h2>
                <div style={{ fontSize: `${fontSize}px`, lineHeight: 1.8 }}>
                  {(activeBook.chapters?.[activeBook.currentPage]?.content || '').split('\n\n').map((p, i) => (
                    <p key={i} className="mb-4">{p}</p>
                  ))}
                </div>
              </div>
            )}
          </main>

          <footer className="h-12 px-6 flex items-center justify-between border-t border-white/10 glass-panel-dark text-xs z-30">
            <button onClick={() => handlePageTurn(-1)} className="hover:text-sky-400">Previous</button>
            <span className="font-mono text-[11px] opacity-70">
              {activeBook.currentPage + 1} / {activeBook.totalPages}
            </span>
            <button onClick={() => handlePageTurn(1)} className="hover:text-sky-400">Next</button>
          </footer>

          {showSettingsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="w-full max-w-sm rounded-2xl glass-panel-dark p-5 border border-white/20 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-white">Settings</h3>
                  <button onClick={() => setShowSettingsModal(false)}><Icon name="x" className="w-4 h-4 text-slate-400" /></button>
                </div>
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Themes</label>
                  <div className="grid grid-cols-4 gap-1.5">
                    {['midnight', 'trueblack', 'sepia', 'paper'].map(t => (
                      <button
                        key={t}
                        onClick={() => setTheme(t)}
                        className={`py-1.5 rounded-lg text-[10px] capitalize border ${theme === t ? 'border-sky-400 bg-white/10' : 'border-white/10'}`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="text-[11px] text-slate-400 flex justify-between">
                    <span>Amber Warmth</span>
                    <span>{warmth}%</span>
                  </label>
                  <input type="range" min="0" max="100" value={warmth} onChange={(e) => setWarmth(parseInt(e.target.value))} className="w-full accent-amber-500" />
                </div>
                <button onClick={() => setShowSettingsModal(false)} className="w-full py-2 bg-sky-500 text-white rounded-xl text-xs font-semibold">Done</button>
              </div>
            </div>
          )}

          {showTOCModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="w-full max-w-xs rounded-2xl glass-panel-dark p-5 border border-white/20">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-sm font-bold text-white">Contents</h3>
                  <button onClick={() => setShowTOCModal(false)}><Icon name="x" className="w-4 h-4 text-slate-400" /></button>
                </div>
                <div className="space-y-1 max-h-60 overflow-y-auto">
                  {(activeBook.type === 'comic' ? activeBook.pages : activeBook.chapters)?.map((item, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        const updated = { ...activeBook, currentPage: idx };
                        setBooks(prev => prev.map(b => b.id === activeBook.id ? updated : b));
                        setShowTOCModal(false);
                      }}
                      className="w-full text-left px-3 py-2 text-xs rounded-lg hover:bg-white/10 text-slate-200"
                    >
                      {item.title || `Page ${idx + 1}`}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AuraApp />);
  </script>
</body>
</html>
