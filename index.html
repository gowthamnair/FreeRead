<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aura Reader</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ES Module Import Map for React & Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0?deps=react@18.3.1"
      }
    }
  </script>

  <!-- Babel Standalone for Client-Side JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';

    async function bootAuraReader() {
      const response = await fetch('./AuraReader.jsx');
      if (!response.ok) {
        throw new Error(`Failed to load AuraReader.jsx: ${response.statusText}`);
      }
      const jsxSource = await response.text();

      const { code } = Babel.transform(jsxSource, {
        presets: [['react', { runtime: 'automatic' }]],
        filename: 'AuraReader.jsx'
      });

      const blob = new Blob([code], { type: 'text/javascript' });
      const moduleUrl = URL.createObjectURL(blob);
      const { default: AuraReader } = await import(moduleUrl);

      const root = createRoot(document.getElementById('root'));
      root.render(React.createElement(AuraReader));
    }

    bootAuraReader().catch((err) => {
      document.getElementById('root').innerHTML = `
        <div style="padding: 24px; font-family: monospace; color: #f87171;">
          Failed to initialize Aura Reader: ${err.message}
        </div>
      `;
      console.error(err);
    });
  </script>
</body>
</html>
